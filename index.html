
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi diario</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>

  <section id="lockScreen" class="lock-screen">
    <div class="safe">
      <div class="safe-top">
        <span>MI DIARIO</span>
        <span class="light"></span>
      </div>

      <div class="safe-door">
        <div class="safe-handle"></div>

        <div class="lock-content">
          <div class="star">✦</div>
          <h1>Un lugar solo mío</h1>
          <p>Introduce tu código para entrar</p>

          <form id="pinForm">
            <input
              id="pinInput"
              type="password"
              inputmode="numeric"
              maxlength="4"
              pattern="[0-9]{4}"
              placeholder="••••"
              autocomplete="off"
              required
            >
            <button type="submit">Desbloquear</button>
            <p id="pinMessage" class="message"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <main id="diaryScreen" class="diary-screen hidden">
    <header class="header">
      <div>
        <span class="eyebrow">MI ESPACIO PERSONAL</span>
        <h1>Mi diario</h1>
      </div>
      <button id="closeDiary" class="close-button">Cerrar diario</button>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <button id="newPage" class="new-button">+ Nueva página</button>
        <h2>Mis páginas</h2>
        <div id="entriesList" class="entries-list"></div>
      </aside>

      <section class="paper-area">
        <article class="paper">
          <input
            id="entryTitle"
            class="entry-title"
            type="text"
            maxlength="100"
            placeholder="Título de esta página..."
          >

          <textarea
            id="entryContent"
            class="entry-content"
            placeholder="Querido diario..."
          ></textarea>

          <footer class="paper-footer">
            <span id="saveStatus">Tus palabras estarán aquí.</span>
            <button id="deletePage" class="delete-button">Eliminar página</button>
          </footer>
        </article>
      </section>
    </div>
  </main>

</body>
</html>
