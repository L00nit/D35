
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D35</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

  <section id="lockScreen" class="lock-screen">
    <div class="safe">
      <div class="safe-icon">🪽</div>
      <p class="eyebrow">Mis últimas palabras</p>
      <h1>D35</h1>
      <p class="lock-description">Inicio o fin?</p>

      <div id="accessOptions">
        <button id="createDiary" type="button">Crear un diario</button>

        <button id="showJoin" type="button" class="new-page">
          Entrar con un código
        </button>
      </div>

      <form id="joinForm" class="hidden">
        <input
          id="codeInput"
          type="text"
          maxlength="12"
          placeholder="Código del diario"
          autocomplete="off"
          required
        >
        <button type="submit">Entrar a mi diario</button>
        <button id="backButton" type="button" class="new-page">
          Volver
        </button>
      </form>

      <div id="createdCode" class="hidden">
        <p>¡Tu diario está creado!</p>
        <p>Comparte este código para que puedan entrar:</p>
        <h2 id="codeDisplay"></h2>
        <button id="copyCode" type="button">Copiar código</button>
        <button id="continueButton" type="button">Abrir mi diario</button>
      </div>

      <p id="pinMessage" class="pin-message"></p>
    </div>
  </section>

  <main id="diaryScreen" class="diary-screen hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">Mis últimas palabras</p>
        <h1>D35</h1>
      </div>
      <button id="lockButton" class="lock-button" type="button">Cerrar diario</button>
    </header>

    <div class="diary-layout">
      <aside class="sidebar">
        <button id="newPage" class="new-page" type="button">
          <span>＋</span> Nueva página
        </button>

        <p class="sidebar-heading">MIS PÁGINAS</p>
        <div id="entriesList" class="entries-list"></div>
      </aside>

      <section class="writing-area">
        <div class="paper">
          <input
            id="entryTitle"
            class="entry-title"
            type="text"
            placeholder="Querido Diario"
            maxlength="100"
          >

          <textarea
            id="entryContent"
            class="entry-content"
            placeholder="el día de hoy..."
          ></textarea>

          <div class="paper-footer">
            <span id="saveStatus">Mis últimas palabras</span>
            <button id="deletePage" class="delete-button" type="button">
              Eliminar página
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
