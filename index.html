<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre líneas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

  <section id="lockScreen" class="lock-screen">
    <div class="safe">
      <div class="safe-icon">✦</div>
      <p class="eyebrow">UN LUGAR SOLO MÍO</p>
      <h1>Entre líneas</h1>
      <p class="lock-description">Algunas cosas merecen quedarse aquí.</p>

      <form id="pinForm">
        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          maxlength="4"
          pattern="[0-9]{4}"
          placeholder="••••"
          autocomplete="off"
          aria-label="Código de acceso"
          required
        >
        <p id="pinMessage" class="pin-message"></p>
        <button type="submit">Abrir mi diario</button>
      </form>
    </div>
  </section>

  <main id="diaryScreen" class="diary-screen hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">MI ESPACIO PERSONAL</p>
        <h1>Entre líneas</h1>
      </div>
      <button id="lockButton" class="lock-button" type="button">Cerrar diario</button>
    </header>

    <div class="diary-layout">
      <aside class="sidebar">
        <button id="newPage" class="new-page" type="button">
          <span>＋</span> Nueva página
        </button>

        <p class="sidebar-heading">MIS PÁGINAS</p>
        <div id="entriesList" class="entries-list"></div>
      </aside>

      <section class="writing-area">
        <div class="paper">
          <input
            id="entryTitle"
            class="entry-title"
            type="text"
            placeholder="Título de esta página..."
            maxlength="100"
          >

          <textarea
            id="entryContent"
            class="entry-content"
            placeholder="Escribe aquí todo lo que quieras recordar..."
          ></textarea>

          <div class="paper-footer">
            <span id="saveStatus">Tus palabras estarán a salvo aquí.</span>
            <button id="deletePage" class="delete-button" type="button">
              Eliminar página
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
